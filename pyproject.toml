[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "junctionmapper"
version = "0.1.0.dev0"
description = "Cell-cell junction quantification: a Python reimplementation of Junction Mapper"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "pandas>=2.1",
    "pyarrow>=14",
    "pydantic>=2.5",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "typer>=0.12",
    "pyyaml>=6.0",
    "bioio>=1.1",
    "bioio-ome-tiff>=1.0",
    "bioio-ome-zarr>=1.0",
    "tifffile>=2024.1.30",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Heavy, GPU-dependent. The library imports cellpose lazily so the rest
# installs and tests without it.
segmentation = ["cellpose>=4.0"]
# zarr is imported directly by tests/test_reader.py and tests/test_cli.py (which build real
# OME-Zarr stores); it also arrives transitively with bioio-ome-zarr, but a test dependency
# that is load-bearing must be declared, not inherited.
dev = ["pytest>=8.0", "pytest-cov>=4.1", "zarr>=3.0"]

[project.scripts]
junctionmapper = "junctionmapper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/junctionmapper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
# Third-party noise from bioio-ome-tiff calling ome-types with a deprecated argument.
filterwarnings = ["ignore:As of version 0.4.0, the parser argument is ignored:DeprecationWarning"]
